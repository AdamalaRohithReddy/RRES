server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: unified-ai-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:citizen_ai_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rohith@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Internal AI Service Integration Settings
ai-service:
  base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  internal-key: ${AI_SERVICE_INTERNAL_KEY:internal-secret-key-change-in-prod}
  timeout-seconds: 60

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

# Document Controlled Storage Configuration
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:D:/RRES/unified-ai-agent/uploads/documents}

# Actuator & Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
